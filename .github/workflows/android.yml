name: Android

# Builds Derp for Android (one APK per processor family) and runs it on an
# emulator: first start (welcome dork editor), a link from another app, dark
# mode. Screenshots are kept as the "screenshots" artifact.
on:
  push:
    branches: [main, android]
    paths:
      - android/**
      - src/features/DerpDork.sys.mjs
      - site/build.py
      - brand/**
      - VERSION
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - src/features/DerpDork.sys.mjs
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build
        run: gradle --no-daemon -p android assembleRelease
      - name: Collect APKs
        run: bash android/ci/collect.sh apks
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/smoke.sh apks/derp-android-x86_64.apk screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
