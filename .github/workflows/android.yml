name: Android

# Builds Derp for Android (one APK per processor family) and runs it on an
# emulator: first start (welcome dork editor), a link from another app, dark
# mode. Screenshots are kept as the "screenshots" artifact.
on:
  push:
    branches: [main, android]
    paths:
      - android/**
      - src/features/DerpDork.sys.mjs
      - src/features/DerpFeatures.sys.mjs
      - config/policies.json
      - tests/pairing.py
      - src/features/doodle-look/**
      - site/build.py
      - brand/**
      - VERSION
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - src/features/DerpDork.sys.mjs
      - src/features/DerpFeatures.sys.mjs
      - config/policies.json
      - tests/pairing.py
      - src/features/doodle-look/**
      - brand/**
      - .github/workflows/android.yml
  workflow_dispatch:
  # The weekly engine update tests a new GeckoView with this before releasing.
  workflow_call:
    inputs:
      geckoview:
        description: GeckoView version to build with, instead of android/geckoview-version.txt
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.0"
      - name: Build
        env:
          GECKOVIEW: ${{ inputs.geckoview }}
        run: gradle --no-daemon -p android assembleRelease ${GECKOVIEW:+-PgeckoviewVersion=$GECKOVIEW}
      - name: Unit tests
        env:
          GECKOVIEW: ${{ inputs.geckoview }}
        run: gradle --no-daemon -p android testDebugUnitTest ${GECKOVIEW:+-PgeckoviewVersion=$GECKOVIEW}
      - name: Collect APKs
        run: bash android/ci/collect.sh apks
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/

  # Release builds are signed with Derp's key from the repo secrets. This
  # checks that path with a throwaway key made the same way (OpenSSL PKCS#12).
  release-signing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.0"
      - name: Build signed with a throwaway key
        env:
          GECKOVIEW: ${{ inputs.geckoview }}
        run: |
          key=$RUNNER_TEMP/test-key
          mkdir -p "$key"
          openssl req -x509 -newkey rsa:4096 -sha256 -days 30 -nodes -subj "/CN=Derp test" -keyout "$key/key.pem" -out "$key/cert.pem"
          openssl pkcs12 -export -inkey "$key/key.pem" -in "$key/cert.pem" -name derp -out "$key/test.p12" -passout pass:test-password
          openssl x509 -in "$key/cert.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f' > "$key/sha256"
          DERP_KEYSTORE="$key/test.p12" DERP_KEYSTORE_PASSWORD=test-password gradle --no-daemon -p android assembleRelease ${GECKOVIEW:+-PgeckoviewVersion=$GECKOVIEW}
          bash android/ci/collect.sh apks
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          for apk in apks/*.apk; do
            "$apksigner" verify --print-certs "$apk" | tee cert.txt
            grep -qi "SHA-256 digest: $(cat "$key/sha256")" cert.txt || { echo "::error::$apk isn't signed with the test key"; exit 1; }
          done

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The smoke test pairs with a stand-in computer (tests/pairing.py).
      - name: Pairing test's crypto
        run: python3 -m pip install --user --quiet cryptography
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/smoke.sh apks/derp-android-x86_64.apk screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
