name: Website

# Builds site/page.html into one self-contained page and publishes it to
# GitHub Pages (https://kingbennet800.github.io/derp/).
on:
  push:
    branches: [main]
    paths:
      - site/**
      - src/features/DerpDork.sys.mjs
      - src/features/DerpDuck.sys.mjs
      - brand/**
      - VERSION
      - .github/workflows/pages.yml
  workflow_dispatch:
  # The weekly engine update calls this after releasing (for the new version).
  workflow_call:
    inputs:
      ref:
        description: What to build the site from (a tag); empty for the default
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Build
        run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
