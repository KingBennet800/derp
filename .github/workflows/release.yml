name: Release

# Push a tag like v1.2.3 (matching VERSION) to publish a release. Installed
# copies of Derp pick it up within 6 hours.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Derp for Android, signed with Derp's release key (Android only installs
  # updates signed with the same key, so a release never ships without it).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Signing key is set up
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASSWORD" ]; then
            echo "::error::The ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD secrets aren't set (see README, Android)."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build signed APKs
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          DERP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEY" | base64 -d > "$RUNNER_TEMP/derp-release.p12"
          DERP_KEYSTORE="$RUNNER_TEMP/derp-release.p12" gradle --no-daemon -p android assembleRelease
          rm -f "$RUNNER_TEMP/derp-release.p12"
      - name: Collect APKs
        run: bash android/ci/collect.sh apks
      - name: Signed with Derp's key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          for apk in apks/*.apk; do
            "$apksigner" verify --print-certs "$apk" | tee cert.txt
            grep -qi "SHA-256 digest: $(cat android/ci/release-cert.sha256)" cert.txt || { echo "::error::$apk isn't signed with Derp's key"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/

  publish:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: .
      - name: Build archives
        run: |
          name=derp-$(cat VERSION)
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          git archive --format=zip --prefix="$name/" -o "$name.zip" HEAD
          sha256sum "$name.tar.gz" "$name.zip" derp-android-*.apk > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" derp-*.tar.gz derp-*.zip derp-android-*.apk SHA256SUMS \
            --title "Derp $(cat VERSION)" --generate-notes --verify-tag

  # The website's Android buttons link straight to the latest release's APKs.
  android-downloads:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: APKs download from the latest release and match SHA256SUMS
        run: |
          latest=https://github.com/$GITHUB_REPOSITORY/releases/latest/download
          for i in $(seq 1 30); do
            curl -fsSL "$latest/SHA256SUMS" -o SHA256SUMS && grep -q " derp-$(cat VERSION).tar.gz" SHA256SUMS && break
            sleep 10
          done
          for flavor in arm64 arm x86_64; do
            curl -fsSL "$latest/derp-android-$flavor.apk" -o "derp-android-$flavor.apk"
          done
          grep ' derp-android-' SHA256SUMS | sha256sum -c

  # Install from the published release exactly the way the README says to.
  one-liners:
    needs: publish
    name: one-liner ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # GitHub's "latest release" link can lag a minute behind publishing.
      - name: Wait until the release is the latest download
        shell: bash
        run: |
          for i in $(seq 1 30); do
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/SHA256SUMS" |
              grep -q " derp-$(cat VERSION).tar.gz" && exit 0
            sleep 10
          done
          echo "derp-$(cat VERSION) never became the latest release download" >&2
          exit 1
      - name: Install (Linux, macOS)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        run: curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install.sh" | bash -s -- --ci
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: '& ([scriptblock]::Create((irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1"))) -CI'
      - name: Verify
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then python tests/verify.py --launch; else python3 tests/verify.py --launch; fi
