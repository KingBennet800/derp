name: Screenshots

# Run by hand: screenshots of Derp for Android on a phone and a tablet
# emulator, for the website (the "screenshots" artifact).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.0"
      - name: Build
        run: gradle --no-daemon -p android assembleRelease
      - name: Collect APKs
        run: bash android/ci/collect.sh apks
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/

  device:
    needs: build
    name: ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        device: [phone, tablet]
        include:
          - device: phone
            profile: pixel_7
          - device: tablet
            profile: pixel_tablet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/showcase.sh apks/derp-android-x86_64.apk screenshots ${{ matrix.device }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.device }}
          path: screenshots/
