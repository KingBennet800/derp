<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New tab</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="newtab">
  <main>
    <button class="mark" id="mark" type="button" aria-label="Derp">
      <img class="logo" src="logo.svg" alt="">
      <picture>
        <source srcset="wordmark-dark.svg" media="(prefers-color-scheme: dark)">
        <img class="wordmark" src="wordmark-light.svg" alt="derp">
      </picture>
    </button>
    <button class="search" id="search" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7.25" cy="7.25" r="4.25"/><path d="m10.4 10.4 2.6 2.6"/></svg>
      Search or enter address
    </button>
    <nav class="tiles" aria-label="Shortcuts">
      <a href="https://en.m.wikipedia.org/"><b class="wiki">W</b>Wikipedia</a>
      <a href="https://m.youtube.com/"><b><svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="6" fill="#ff0033"/><path d="M11.5 6v8l7-4z" fill="#fff"/></svg></b>YouTube</a>
      <a href="https://www.reddit.com/"><b><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#ff4500"/><text x="12" y="16.6" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">r</text></svg></b>Reddit</a>
      <a href="https://kingbennet800.github.io/derp/"><b><img src="logo.svg" alt=""></b>Derp</a>
    </nav>
    <section class="marks" id="marks" aria-label="Your bookmarks" hidden>
      <nav class="tiles" id="mark-tiles"></nav>
      <a class="marks-all" href="bookmarks.html">All bookmarks</a>
    </section>
  </main>
  <script src="dork-art.js"></script>
  <script src="pages.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
