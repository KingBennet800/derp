<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passwords</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="library">
  <header class="lib-head">
    <h1>Passwords</h1>
    <label class="lib-toggle">
      <span>Offer to save passwords<small>When you sign in to a site, Derp asks whether to save the password.</small></span>
      <input id="offer" type="checkbox" role="switch">
    </label>
    <label class="lib-search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7.25" cy="7.25" r="4.25"/><path d="m10.4 10.4 2.6 2.6"/></svg><input id="q" type="search" placeholder="Search passwords" aria-label="Search passwords" autocomplete="off"></label>
  </header>
  <ul class="lib-list" id="list"></ul>
  <p class="lib-empty" id="empty" hidden></p>
  <div class="lib-actions"><a class="lib-btn" href="import.html">Import passwords</a></div>
  <p class="lib-note">Your passwords are encrypted and kept only on this device. Showing or copying one asks for your screen lock.</p>
  <script src="pages.js"></script>
  <script src="passwords.js"></script>
</body>
</html>
