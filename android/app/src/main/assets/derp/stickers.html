<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screenshot with stickers</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="stickers.css">
<style>
  /* The editor fills the page here (desktop Derp shows it over the window). */
  html, body { height: 100%; margin: 0; }
  body { display: grid; padding: 0; overflow: hidden; }
  #editor { display: grid; min-height: 0; }
  .derp-st {
    --st-accent: var(--accent);
    --st-surface: var(--bg);
    --st-text: var(--text);
    --st-line: var(--line);
    width: 100%;
    height: 100%;
    max-height: none;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    border-radius: 0;
    box-shadow: none;
    font: 15px/1.4 system-ui, sans-serif;
  }
  .derp-st-hint { flex-basis: 100%; font-size: 13px; }
  .derp-st-tray > button { width: 52px; height: 52px; }
  .derp-st-x, .derp-st-grip { width: 30px; height: 30px; }
  .derp-st-x { top: -20px; left: -20px; }
  .derp-st-grip { right: -20px; bottom: -20px; }
  #empty { margin: auto; padding: 24px; color: var(--dim); text-align: center; }
  #empty button { margin-top: 14px; padding: 8px 20px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; }
</style>
</head>
<body>
  <main id="editor">
    <div id="empty" hidden>
      <p>This screenshot is gone (Derp was closed in between). Take another from the page’s ⋮ menu.</p>
      <button id="close" type="button">Close</button>
    </div>
  </main>
  <script src="dork-art.js"></script>
  <script src="critters.js"></script>
  <script src="stickers.js"></script>
  <script src="pages.js"></script>
  <script src="stickers-page.js"></script>
</body>
</html>
