// Derp: load Derp's theme and browser features at startup (autoconfig skips this first line).
(function () {
  const { interfaces: Ci, utils: Cu } = Components;
  try {
    // Derp's files: next to the engine folder on Linux and Windows
    // (~/.local/share/derp, %LOCALAPPDATA%\Derp), in Application Support on macOS.
    const candidates = [Services.dirsvc.get("GreD", Ci.nsIFile).parent];
    const mac = Services.dirsvc.get("Home", Ci.nsIFile);
    mac.append("Library");
    mac.append("Application Support");
    mac.append("Derp");
    candidates.push(mac);
    const home = candidates.find(dir => {
      const features = dir.clone();
      features.append("features");
      return features.exists();
    });
    if (!home) {
      return;
    }
    const child = (dir, ...names) => {
      const file = dir.clone();
      for (const name of names) {
        file.append(name);
      }
      return file;
    };

    // Keep the profile's chrome/ folder in step with Derp's theme. Your own
    // custom.css and custom-content.css are created once and never touched.
    const sync = (from, to) => {
      if (!to.exists()) {
        to.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
      }
      for (const file of from.directoryEntries) {
        const target = child(to, file.leafName);
        if (file.isDirectory()) {
          sync(file, target);
        } else if (/^custom(-content)?\.css$/.test(file.leafName)) {
          if (!target.exists()) {
            file.copyTo(to, null);
          }
        } else if (!target.exists() || target.fileSize !== file.fileSize || target.lastModifiedTime !== file.lastModifiedTime) {
          if (target.exists()) {
            target.remove(false);
          }
          file.copyTo(to, null);
          target.lastModifiedTime = file.lastModifiedTime;
        }
      }
    };
    const theme = child(home, "theme");
    if (theme.exists()) {
      sync(theme, child(Services.dirsvc.get("ProfD", Ci.nsIFile), "chrome"));
    }

    const features = child(home, "features");
    Services.io
      .getProtocolHandler("resource")
      .QueryInterface(Ci.nsIResProtocolHandler)
      .setSubstitution("derp", Services.io.newFileURI(features));
    // The startup cache keys modules by URL, so version it to pick up edits.
    const module = child(features, "DerpFeatures.sys.mjs");
    ChromeUtils.importESModule(`resource://derp/DerpFeatures.sys.mjs?v=${module.lastModifiedTime}`).DerpFeatures.init();
  } catch (e) {
    Cu.reportError(e);
  }
})();
