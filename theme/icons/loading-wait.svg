<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="context-fill">
  <!-- Waiting for the server: a quieter, slower hop in the tab's text color. -->
  <style>
    .orb { transform-origin: 8px 14.4px; animation: hop 760ms cubic-bezier(0.33, 0, 0.67, 1) infinite alternate; }
    @keyframes hop {
      0% { transform: translateY(0) scale(1.1, 0.9); }
      100% { transform: translateY(-3.5px) scale(1, 1); }
    }
  </style>
  <g class="orb" fill-opacity="0.5">
    <circle cx="8" cy="10" r="4.4"/>
  </g>
</svg>
