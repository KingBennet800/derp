<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Derp's tab loader: the orb bounces with a little squash and stretch. -->
  <style>
    .orb { transform-origin: 8px 14.4px; animation: hop 520ms cubic-bezier(0.33, 0, 0.67, 1) infinite alternate; }
    .shadow { transform-origin: 8px 15.2px; animation: shade 520ms cubic-bezier(0.33, 0, 0.67, 1) infinite alternate; }
    @keyframes hop {
      0% { transform: translateY(0) scale(1.16, 0.84); }
      22% { transform: translateY(-1.6px) scale(0.94, 1.07); }
      100% { transform: translateY(-5px) scale(1, 1); }
    }
    @keyframes shade {
      0% { transform: scaleX(1); opacity: 0.35; }
      100% { transform: scaleX(0.55); opacity: 0.15; }
    }
  </style>
  <defs>
    <linearGradient id="g" x1="3" y1="5" x2="13" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C6F57E"/>
      <stop offset=".45" stop-color="#2FD6BE"/>
      <stop offset="1" stop-color="#2F6FEB"/>
    </linearGradient>
  </defs>
  <ellipse class="shadow" cx="8" cy="15.2" rx="3.6" ry="0.7" fill="#000"/>
  <g class="orb">
    <circle cx="8" cy="10" r="4.4" fill="url(#g)"/>
    <circle cx="6.5" cy="9.2" r="1.25" fill="#fff"/>
    <circle cx="9.6" cy="9" r="1.45" fill="#fff"/>
    <circle cx="6.9" cy="8.8" r="0.6" fill="#0B1424"/>
    <circle cx="9.3" cy="9.5" r="0.7" fill="#0B1424"/>
  </g>
</svg>
